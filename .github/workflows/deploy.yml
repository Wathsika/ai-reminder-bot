name: CI/CD Pipeline

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          # Note: Added tags for both 'latest' and the specific commit SHA for better tracking
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ai-reminder-bot:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ai-reminder-bot:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy to Oracle VPS via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p ~/ai-reminder-bot && cd ~/ai-reminder-bot

            # Create .env file
            cat <<EOF > .env
            DISCORD_TOKEN=${{ secrets.DISCORD_TOKEN }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            ADMIN_ID=${{ secrets.ADMIN_ID }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_NAME=${{ secrets.DB_NAME }}
            DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            DATABASE_URL=postgresql+psycopg2://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@db:5432/${{ secrets.DB_NAME }}
            EOF

            # Create docker-compose.yml
            cat <<EOF > docker-compose.yml
            services:
              db:
                image: postgres:15-alpine
                environment:
                  POSTGRES_USER: ${{ secrets.DB_USER }}
                  POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
                  POSTGRES_DB: ${{ secrets.DB_NAME }}
                volumes:
                  - postgres_data:/var/lib/postgresql/data
                deploy:
                  resources:
                    limits:
                      memory: 256M
              bot:
                image: ${{ secrets.DOCKERHUB_USERNAME }}/ai-reminder-bot:latest
                env_file: .env
                depends_on:
                  - db
                restart: always
                deploy:
                  resources:
                    limits:
                      memory: 512M
            volumes:
              postgres_data:
            EOF

            # Clean up old images to save disk space on VPS
            sudo docker system prune -f

            # Pull and Restart
            sudo docker compose pull
            sudo docker compose up -d
